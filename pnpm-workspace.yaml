onlyBuiltDependencies:
  - puppeteer
# TypeScript 7 (tsgo) native packages are first-party (Microsoft) and needed
# promptly for the `tsc --lsp` language server; exempt them from pnpm's default
# 1-day minimumReleaseAge supply-chain guard. (glob + version union is rejected
# by pnpm, so the per-platform binaries are matched by name pattern.)
minimumReleaseAgeExclude:
  - typescript@7.0.2
  - "@typescript/typescript-*"
  # The pinned pnpm release must work before the default 1-day release-age cutoff.
  - "@pnpm/exe.android-arm64@12.21.0"
  - "@pnpm/exe.android-x64@12.21.0"
  - "@pnpm/exe.darwin-arm64@12.21.0"
  - "@pnpm/exe.darwin-x64@12.21.0"
  - "@pnpm/exe.freebsd-x64@12.21.0"
  - "@pnpm/exe.linux-arm64-musl@12.21.0"
  - "@pnpm/exe.linux-arm64@12.21.0"
  - "@pnpm/exe.linux-ppc64@12.21.0"
  - "@pnpm/exe.linux-riscv64@12.21.0"
  - "@pnpm/exe.linux-s390x@12.21.0"
  - "@pnpm/exe.linux-x64-musl@12.21.0"
  - "@pnpm/exe.linux-x64@12.21.0"
  - "@pnpm/exe.netbsd-x64@12.21.0"
  - "@pnpm/exe.win32-arm64@12.21.0"
  - "@pnpm/exe.win32-x64@12.21.0"
  - pnpm@12.21.0
allowBuilds:
  core-js: true
  protobufjs: true
  puppeteer: true
overrides:
  "@informalsystems/quint>adm-zip": 0.6.1
  "@informalsystems/quint>tar": 7.5.22
